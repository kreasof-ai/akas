name: Contracts and standalone inference package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TENSOR_NVRTC_HOME: ${{ github.workspace }}/build/nvrtc-12.9
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.9"
      - run: uv sync --locked --extra compiler
      - run: uv run --no-sync python -m pytest
      - run: uv run --no-sync python tools/bootstrap_nvrtc.py --out build/nvrtc-12.9
      - run: uv run --no-sync python -m benchmarks.lfm2.diagnostic --out build/diagnostic.gguf
      - run: uv run --no-sync python -m akas compile --definition akas.models.lfm2.model:LFM2 --checkpoint build/diagnostic.gguf --profile packed --out build/diagnostic --config '{"context":384,"target":"sm_86"}'
      - run: uv build --out-dir build/wheels
      - name: Read the pinned Tensor revision
        id: tensor
        run: |
          python - <<'PYTHON'
          import os, tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())
          revision = project["tool"]["uv"]["sources"]["tensor-workspace"]["rev"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"revision={revision}\n")
          PYTHON
      - uses: actions/checkout@v7.0.1
        with:
          repository: kreasof-ai/tensor
          ref: ${{ steps.tensor.outputs.revision }}
          path: build/tensor-source
      - name: Build the pinned Tensor dependency wheel
        run: uv build --wheel --out-dir build/wheels build/tensor-source
      - name: Inspect with a compiler-free consumer
        shell: bash
        run: |
          uv venv --python 3.12 build/consumer
          uv pip install --python build/consumer/bin/python build/wheels/*.whl
          build/consumer/bin/python -m akas inspect --model build/diagnostic.gguf
          build/consumer/bin/python - <<'PY'
          import importlib.abc, sys
          class Guard(importlib.abc.MetaPathFinder):
              def find_spec(self, fullname, path=None, target=None):
                  if fullname.startswith(('akas.compilation', 'tensor.compiler')) or fullname.split('.')[0] in {'torch', 'tilelang', 'tvm', 'tvm_ffi', 'triton'}:
                      raise ImportError(fullname)
          sys.meta_path.insert(0, Guard())
          from akas import Engine, LFM2, Qwen35Batch
          from akas.execution.forward import Forward
          from akas.planning import ForwardPlan
          plan = ForwardPlan(contract='packed')
          value = plan.buffer('x', (256,), 'float32')
          plan('add', dict(c=256), value, value, value)
          assert len(ForwardPlan.from_metadata(plan.metadata()).requirements()) == 1
          from akas.artifacts.fingerprints import packed_hashes as implementation_hashes
          import json
          from pathlib import Path
          assert json.loads(Path('build/diagnostic/inference.json').read_text())['implementation'] == implementation_hashes()
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: standalone-inference-package
          path: build/wheels/*
